<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <!-- Cosmic Deep Blue & Violet Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081a" />
      <stop offset="55%" stop-color="#0b102d" />
      <stop offset="100%" stop-color="#120d35" />
    </linearGradient>
    <!-- Neon Purple & Electric Blue Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>
    <!-- AI Chip Core Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <!-- AI Text Gradient -->
    <linearGradient id="aiText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Card Container -->
  <rect x="2" y="2" width="996" height="296" rx="16" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Right Nebula Behind AI Chip -->
  <circle cx="855" cy="165" r="95" fill="#6d28d9" opacity="0.22" filter="url(#glow)" />
  <circle cx="825" cy="155" r="75" fill="#2563eb" opacity="0.2" filter="url(#glow)" />

  <!-- Section Header -->
  <circle cx="42" cy="38" r="13" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5" />
  <circle cx="42" cy="34" r="4" fill="#e9d5ff" />
  <path d="M 35 45 Q 42 39 49 45" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" />
  <text x="66" y="44" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700">
    About Me
  </text>
  <line x1="28" y1="60" x2="972" y2="60" stroke="#1e293b" stroke-width="1.2" />

  <!-- Bullet Points Matching Uploaded Reference Image -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e2e8f0">
    <text x="36" y="92">🎓  BSc (Hons) <tspan font-weight="700" fill="#ffffff">Software Engineering</tspan> – University of Bedfordshire (2:1).</text>
    <text x="36" y="122">💼  Software Engineer at <tspan font-weight="700" fill="#ffffff">Ultrakerb</tspan>.</text>
    <text x="36" y="152">🤖  Interested in <tspan font-weight="700" fill="#ffffff">Artificial Intelligence, Machine Learning</tspan> and <tspan font-weight="700" fill="#ffffff">Computer Vision</tspan>.</text>
    <text x="36" y="182">✨  Exploring <tspan font-weight="700" fill="#ffffff">Generative AI, Deep Learning</tspan> and <tspan font-weight="700" fill="#ffffff">Diffusion Models</tspan>.</text>
    <text x="36" y="212">📱  Building <tspan font-weight="700" fill="#ffffff">Full-Stack Web</tspan> and <tspan font-weight="700" fill="#ffffff">Mobile Applications</tspan>.</text>
    <text x="36" y="242">⭐  Currently researching <tspan font-weight="700" fill="#ffffff">AI-based Virtual Saree Draping</tspan>.</text>
    <text x="36" y="272">📍  <tspan fill="#cbd5e1">Jaffna, Sri Lanka.</tspan></text>
  </g>

  <!-- Right Side: Glowing Futuristic "AI" Microchip Illustration -->
  <g transform="translate(765, 78)">
    <!-- Circuit Pins Top -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <line x1="45" y1="22" x2="45" y2="4" /><circle cx="45" cy="4" r="2.5" fill="#38bdf8" />
      <line x1="68" y1="22" x2="68" y2="4" /><circle cx="68" cy="4" r="2.5" fill="#c084fc" />
      <line x1="91" y1="22" x2="91" y2="4" /><circle cx="91" cy="4" r="2.5" fill="#38bdf8" />
      <line x1="114" y1="22" x2="114" y2="4" /><circle cx="114" cy="4" r="2.5" fill="#c084fc" />
      <line x1="137" y1="22" x2="137" y2="4" /><circle cx="137" cy="4" r="2.5" fill="#38bdf8" />
    </g>
    <!-- Circuit Pins Bottom -->
    <g stroke="#a855f7" stroke-width="2.5" stroke-linecap="round">
      <line x1="45" y1="158" x2="45" y2="176" /><circle cx="45" cy="176" r="2.5" fill="#a855f7" />
      <line x1="68" y1="158" x2="68" y2="176" /><circle cx="68" cy="176" r="2.5" fill="#38bdf8" />
      <line x1="91" y1="158" x2="91" y2="176" /><circle cx="91" cy="176" r="2.5" fill="#a855f7" />
      <line x1="114" y1="158" x2="114" y2="176" /><circle cx="114" cy="176" r="2.5" fill="#38bdf8" />
      <line x1="137" y1="158" x2="137" y2="176" /><circle cx="137" cy="176" r="2.5" fill="#a855f7" />
    </g>
    <!-- Circuit Pins Left -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round">
      <line x1="22" y1="45" x2="4" y2="45" /><circle cx="4" cy="45" r="2.5" fill="#38bdf8" />
      <line x1="22" y1="68" x2="4" y2="68" /><circle cx="4" cy="68" r="2.5" fill="#c084fc" />
      <line x1="22" y1="91" x2="4" y2="91" /><circle cx="4" cy="91" r="2.5" fill="#38bdf8" />
      <line x1="22" y1="114" x2="4" y2="114" /><circle cx="4" cy="114" r="2.5" fill="#c084fc" />
      <line x1="22" y1="137" x2="4" y2="137" /><circle cx="4" cy="137" r="2.5" fill="#38bdf8" />
    </g>
    <!-- Circuit Pins Right -->
    <g stroke="#a855f7" stroke-width="2.5" stroke-linecap="round">
      <line x1="158" y1="45" x2="176" y2="45" /><circle cx="176" cy="45" r="2.5" fill="#a855f7" />
      <line x1="158" y1="68" x2="176" y2="68" /><circle cx="176" cy="68" r="2.5" fill="#38bdf8" />
      <line x1="158" y1="91" x2="176" y2="91" /><circle cx="176" cy="91" r="2.5" fill="#a855f7" />
      <line x1="158" y1="114" x2="176" y2="114" /><circle cx="176" cy="114" r="2.5" fill="#38bdf8" />
      <line x1="158" y1="137" x2="176" y2="137" /><circle cx="176" cy="137" r="2.5" fill="#a855f7" />
    </g>

    <!-- Outer Microchip Body -->
    <rect x="22" y="22" width="136" height="136" rx="18" fill="url(#chipGrad)" stroke="#60a5fa" stroke-width="2.5" />
    <!-- Inner Glowing Processor Core -->
    <rect x="38" y="38" width="104" height="104" rx="12" fill="#080c24" stroke="#a855f7" stroke-width="1.8" />
    <!-- AI Letters -->
    <text x="90" y="106" text-anchor="middle" fill="url(#aiText)" font-family="'Segoe UI', sans-serif" font-size="46" font-weight="800" filter="url(#glow)">
      AI
    </text>
  </g>
</svg>
