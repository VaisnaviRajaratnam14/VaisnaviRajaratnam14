      <rect x="132" y="38" width="11" height="11" rx="2" /><rect x="196" y="8" width="11" height="11" rx="2" />
      <rect x="260" y="53" width="11" height="11" rx="2" /><rect x="340" y="23" width="11" height="11" rx="2" />
      <rect x="420" y="38" width="11" height="11" rx="2" /><rect x="500" y="8" width="11" height="11" rx="2" />
      <rect x="580" y="53" width="11" height="11" rx="2" /><rect x="660" y="23" width="11" height="11" rx="2" />
      <rect x="740" y="38" width="11" height="11" rx="2" /><rect x="820" y="8" width="11" height="11" rx="2" />
