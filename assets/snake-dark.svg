<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" height="210">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030816" />
      <stop offset="50%" stop-color="#071432" />
      <stop offset="100%" stop-color="#040b1f" />
    </linearGradient>
    <linearGradient id="snakeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="996" height="206" rx="16" fill="url(#snakeBg)" stroke="url(#snakeBorder)" stroke-width="2" />

  <text x="36" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">
    🐍 Contribution Activity Grid
  </text>
  <text x="964" y="38" text-anchor="end" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    @VaisnaviRajaratnam14
  </text>

  <!-- Month Labels -->
  <g fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="11">
