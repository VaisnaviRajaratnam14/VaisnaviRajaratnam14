<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" height="210">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090716" />
      <stop offset="50%" stop-color="#0e0b24" />
      <stop offset="100%" stop-color="#080b1a" />
    </linearGradient>
    <linearGradient id="snakeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="996" height="206" rx="16" fill="url(#snakeBg)" stroke="url(#snakeBorder)" stroke-width="2" />

  <text x="36" y="38" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700">
    🐍 Contribution Activity Grid
  </text>
  <text x="964" y="38" text-anchor="end" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="600">
    @VaisnaviRajaratnam14
  </text>

  <!-- Month Labels -->
  <g fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">
    <text x="85" y="64">Nov</text>
    <text x="160" y="64">Dec</text>
    <text x="235" y="64">Jan</text>
    <text x="310" y="64">Feb</text>
    <text x="385" y="64">Mar</text>
    <text x="460" y="64">Apr</text>
    <text x="535" y="64">May</text>
    <text x="610" y="64">Jun</text>
    <text x="685" y="64">Jul</text>
    <text x="760" y="64">Aug</text>
    <text x="835" y="64">Sep</text>
    <text x="910" y="64">Oct</text>
  </g>

