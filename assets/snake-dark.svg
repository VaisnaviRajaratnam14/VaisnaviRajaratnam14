      <rect x="228" y="53" width="11" height="11" rx="2" /><rect x="308" y="8" width="11" height="11" rx="2" />
      <rect x="388" y="38" width="11" height="11" rx="2" /><rect x="468" y="23" width="11" height="11" rx="2" />
      <rect x="548" y="53" width="11" height="11" rx="2" /><rect x="628" y="38" width="11" height="11" rx="2" />
      <rect x="708" y="23" width="11" height="11" rx="2" /><rect x="788" y="53" width="11" height="11" rx="2" />
    </g>
    <g fill="#26a641">
      <rect x="100" y="8" width="11" height="11" rx="2" /><rect x="292" y="23" width="11" height="11" rx="2" />
      <rect x="308" y="23" width="11" height="11" rx="2" /><rect x="324" y="38" width="11" height="11" rx="2" />
      <rect x="452" y="38" width="11" height="11" rx="2" /><rect x="596" y="23" width="11" height="11" rx="2" />
      <rect x="692" y="38" width="11" height="11" rx="2" /><rect x="772" y="23" width="11" height="11" rx="2" />
    </g>
    <g fill="#39d353">
      <rect x="292" y="38" width="11" height="11" rx="2" /><rect x="308" y="38" width="11" height="11" rx="2" />
      <rect x="468" y="38" width="11" height="11" rx="2" /><rect x="612" y="38" width="11" height="11" rx="2" />
      <rect x="756" y="38" width="11" height="11" rx="2" /><rect x="836" y="23" width="11" height="11" rx="2" />
    </g>

    <!-- Animated Cyberpunk Snake Path -->
    <path d="M 16 14 L 180 14 L 180 44 L 360 44 L 360 28 L 560 28 L 560 58 L 760 58 L 760 28 L 860 28"
          fill="none" stroke="url(#snakeBody)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="140 900">
      <animate attributeName="stroke-dashoffset" values="1040;0" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Legend -->
  <text x="835" y="186" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">Less</text>
  <circle cx="870" cy="182" r="4.5" fill="#161b22" />
  <circle cx="884" cy="182" r="4.5" fill="#0e4429" />
  <circle cx="898" cy="182" r="4.5" fill="#006d32" />
  <circle cx="912" cy="182" r="4.5" fill="#26a641" />
  <circle cx="926" cy="182" r="4.5" fill="#39d353" />
  <text x="938" y="186" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="11">More</text>
</svg>
