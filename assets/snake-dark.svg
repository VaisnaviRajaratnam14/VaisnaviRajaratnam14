  <circle cx="870" cy="182" r="4.5" fill="#0b1938" />
  <circle cx="884" cy="182" r="4.5" fill="#0c2d6b" />
  <circle cx="898" cy="182" r="4.5" fill="#1d4ed8" />
  <circle cx="912" cy="182" r="4.5" fill="#0284c7" />
  <circle cx="926" cy="182" r="4.5" fill="#38bdf8" />
  <text x="938" y="186" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="11">More</text>
</svg>
