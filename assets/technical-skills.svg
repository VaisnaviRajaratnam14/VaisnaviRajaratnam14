<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="350">
  <defs>
    <!-- Cosmic Deep Blue & Violet Card Background -->
    <linearGradient id="skillsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081a" />
      <stop offset="55%" stop-color="#0a0f2b" />
      <stop offset="100%" stop-color="#110c32" />
    </linearGradient>
    <!-- Neon Purple & Electric Blue Border -->
    <linearGradient id="skillsBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>
    <!-- Pill Background -->
    <linearGradient id="pillFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1433" />
      <stop offset="100%" stop-color="#141138" />
    </linearGradient>
    <!-- Neon </> Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="996" height="346" rx="16" fill="url(#skillsBg)" stroke="url(#skillsBorder)" stroke-width="2" />

  <!-- Ambient Glow Behind </> Emblem -->
  <circle cx="905" cy="95" r="55" fill="#7c3aed" opacity="0.22" filter="url(#glow)" />

  <!-- Header: Wrench Icon + Technical Skills -->
  <circle cx="42" cy="36" r="13" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.4" />
  <text x="42" y="41" text-anchor="middle" font-size="13">🔧</text>
  <text x="66" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="19.5" font-weight="700">
    Technical Skills
  </text>

  <!-- Right Side Glowing </> Emblem -->
  <text x="905" y="108" text-anchor="middle" fill="url(#codeGrad)" font-family="'Consolas', 'Courier New', monospace" font-size="48" font-weight="800" filter="url(#glow)">
    &lt;/&gt;
  </text>

  <!-- 1. AI / Machine Learning & Computer Vision -->
  <text x="36" y="76" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <tspan fill="#a855f7">⚛️</tspan>  AI / Machine Learning &amp; Computer Vision
  </text>
  <g transform="translate(36, 88)" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
    <text x="0" y="21" fill="#6366f1">+</text>
    <!-- Python -->
    <rect x="18" y="0" width="98" height="30" rx="15" fill="url(#pillFill)" stroke="#3b82f6" stroke-width="1.2" />
    <text x="67" y="20" text-anchor="middle">🐍 Python</text>
    <!-- PyTorch -->
    <rect x="128" y="0" width="104" height="30" rx="15" fill="url(#pillFill)" stroke="#ef4444" stroke-width="1.2" />
    <text x="180" y="20" text-anchor="middle">🔥 PyTorch</text>
    <!-- OpenCV -->
    <rect x="244" y="0" width="104" height="30" rx="15" fill="url(#pillFill)" stroke="#a855f7" stroke-width="1.2" />
    <text x="296" y="20" text-anchor="middle">🟣 OpenCV</text>
    <!-- Jupyter -->
    <rect x="360" y="0" width="104" height="30" rx="15" fill="url(#pillFill)" stroke="#f97316" stroke-width="1.2" />
    <text x="412" y="20" text-anchor="middle">🪐 Jupyter</text>
    <!-- NumPy / Stable Diffusion -->
    <rect x="476" y="0" width="102" height="30" rx="15" fill="url(#pillFill)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="527" y="20" text-anchor="middle">🧊 NumPy</text>
    <rect x="590" y="0" width="146" height="30" rx="15" fill="url(#pillFill)" stroke="#c084fc" stroke-width="1.2" />
    <text x="663" y="20" text-anchor="middle">✨ Stable Diffusion</text>
  </g>

  <!-- 2. Frontend & Mobile Development -->
  <text x="36" y="144" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <tspan fill="#f59e0b">✨</tspan>  Frontend &amp; Mobile Development
  </text>
  <g transform="translate(36, 156)" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
    <text x="0" y="21" fill="#6366f1">+</text>
    <!-- React -->
    <rect x="18" y="0" width="90" height="30" rx="15" fill="url(#pillFill)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="63" y="20" text-anchor="middle">⚛️ React</text>
    <!-- Next.js -->
    <rect x="120" y="0" width="98" height="30" rx="15" fill="url(#pillFill)" stroke="#94a3b8" stroke-width="1.2" />
    <text x="169" y="20" text-anchor="middle">▲ Next.js</text>
    <!-- TypeScript -->
    <rect x="230" y="0" width="118" height="30" rx="15" fill="url(#pillFill)" stroke="#3b82f6" stroke-width="1.2" />
    <text x="289" y="20" text-anchor="middle">🟦 TypeScript</text>
    <!-- JavaScript -->
    <rect x="360" y="0" width="118" height="30" rx="15" fill="url(#pillFill)" stroke="#eab308" stroke-width="1.2" />
    <text x="419" y="20" text-anchor="middle">🟨 JavaScript</text>
    <!-- React Native -->
    <rect x="490" y="0" width="132" height="30" rx="15" fill="url(#pillFill)" stroke="#06b6d4" stroke-width="1.2" />
    <text x="556" y="20" text-anchor="middle">📱 React Native</text>
    <!-- Vite -->
    <rect x="634" y="0" width="84" height="30" rx="15" fill="url(#pillFill)" stroke="#a855f7" stroke-width="1.2" />
    <text x="676" y="20" text-anchor="middle">⚡ Vite</text>
  </g>

  <!-- 3. Backend & Programming Languages -->
  <text x="36" y="212" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <tspan fill="#38bdf8">⚙️</tspan>  Backend &amp; Programming Languages
  </text>
  <g transform="translate(36, 224)" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
    <text x="0" y="21" fill="#6366f1">+</text>
    <!-- Flask -->
    <rect x="18" y="0" width="90" height="30" rx="15" fill="url(#pillFill)" stroke="#60a5fa" stroke-width="1.2" />
    <text x="63" y="20" text-anchor="middle">🧪 Flask</text>
    <!-- FastAPI -->
    <rect x="120" y="0" width="102" height="30" rx="15" fill="url(#pillFill)" stroke="#14b8a6" stroke-width="1.2" />
    <text x="171" y="20" text-anchor="middle">⚡ FastAPI</text>
    <!-- Django -->
    <rect x="234" y="0" width="98" height="30" rx="15" fill="url(#pillFill)" stroke="#22c55e" stroke-width="1.2" />
    <text x="283" y="20" text-anchor="middle">🟢 Django</text>
    <!-- Node.js -->
    <rect x="344" y="0" width="102" height="30" rx="15" fill="url(#pillFill)" stroke="#4ade80" stroke-width="1.2" />
    <text x="395" y="20" text-anchor="middle">🟩 Node.js</text>
    <!-- Java -->
    <rect x="458" y="0" width="86" height="30" rx="15" fill="url(#pillFill)" stroke="#f97316" stroke-width="1.2" />
    <text x="501" y="20" text-anchor="middle">☕ Java</text>
    <!-- C -->
    <rect x="556" y="0" width="68" height="30" rx="15" fill="url(#pillFill)" stroke="#3b82f6" stroke-width="1.2" />
    <text x="590" y="20" text-anchor="middle">🔵 C</text>
  </g>

  <!-- 4. Database & Developer Tools -->
  <text x="36" y="280" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">
    <tspan fill="#c084fc">🗄️</tspan>  Database &amp; Developer Tools
  </text>
  <g transform="translate(36, 292)" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">
    <text x="0" y="21" fill="#6366f1">+</text>
    <!-- PostgreSQL -->
    <rect x="18" y="0" width="122" height="30" rx="15" fill="url(#pillFill)" stroke="#3b82f6" stroke-width="1.2" />
    <text x="79" y="20" text-anchor="middle">🐘 PostgreSQL</text>
    <!-- MySQL -->
    <rect x="152" y="0" width="96" height="30" rx="15" fill="url(#pillFill)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="200" y="20" text-anchor="middle">🐬 MySQL</text>
    <!-- MongoDB -->
    <rect x="260" y="0" width="114" height="30" rx="15" fill="url(#pillFill)" stroke="#22c55e" stroke-width="1.2" />
    <text x="317" y="20" text-anchor="middle">🍃 MongoDB</text>
    <!-- Firebase -->
    <rect x="386" y="0" width="106" height="30" rx="15" fill="url(#pillFill)" stroke="#f59e0b" stroke-width="1.2" />
    <text x="439" y="20" text-anchor="middle">🔥 Firebase</text>
    <!-- Supabase -->
    <rect x="504" y="0" width="112" height="30" rx="15" fill="url(#pillFill)" stroke="#10b981" stroke-width="1.2" />
    <text x="560" y="20" text-anchor="middle">⚡ Supabase</text>
    <!-- Git -->
    <rect x="628" y="0" width="76" height="30" rx="15" fill="url(#pillFill)" stroke="#ef4444" stroke-width="1.2" />
    <text x="666" y="20" text-anchor="middle">❤️ Git</text>
    <!-- Figma -->
    <rect x="716" y="0" width="90" height="30" rx="15" fill="url(#pillFill)" stroke="#a855f7" stroke-width="1.2" />
    <text x="761" y="20" text-anchor="middle">🎨 Figma</text>
  </g>
</svg>
