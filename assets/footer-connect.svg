<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320">
  <defs>
    <!-- Deep Midnight Navy & Cosmic Violet Sky (#030716 -> #080B24 -> #140d36) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030716" />
      <stop offset="45%" stop-color="#080B24" />
      <stop offset="80%" stop-color="#130d38" />
      <stop offset="100%" stop-color="#06091e" />
    </linearGradient>
    <!-- Violet Moonlight Lake Reflection -->
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#030716" stop-opacity="0.98" />
    </linearGradient>
    <!-- Neon Border -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9" />
    </linearGradient>
    <!-- Flowing Neon Bottom Waves -->
    <linearGradient id="wavePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>
    <!-- Glass Card Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c26" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#120e36" stop-opacity="0.88" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Canvas -->
  <rect x="2" y="2" width="996" height="316" rx="18" fill="url(#skyGrad)" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Violet Moonlight & Mist Orbs -->
  <circle cx="195" cy="145" r="95" fill="#a855f7" opacity="0.25" filter="url(#softBloom)" />
  <circle cx="260" cy="185" r="75" fill="#ec4899" opacity="0.18" filter="url(#softBloom)" />
  <circle cx="155" cy="175" r="55" fill="#38bdf8" opacity="0.2" filter="url(#softBloom)" />

  <!-- Twinkling Stars & Floating Glowing Particles -->
  <g fill="#ffffff">
    <circle cx="290" cy="36" r="1.5" opacity="0.8" />
    <circle cx="350" cy="58" r="1.2" opacity="0.6" />
    <circle cx="420" cy="28" r="1.8" fill="#e879f9" opacity="0.8" />
    <circle cx="520" cy="42" r="1.4" fill="#38bdf8" opacity="0.7" />
    <circle cx="680" cy="30" r="1.6" fill="#c084fc" opacity="0.7" />
    <circle cx="840" cy="40" r="1.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="930" cy="26" r="1.8" fill="#f472b6" opacity="0.7" />
  </g>

  <!-- Distant Magical Mountains with Soft Purple Mist -->
  <polygon points="4,220 95,155 175,195 265,140 355,205 430,175 490,220" fill="#17113a" opacity="0.85" />
  <polygon points="60,220 145,168 225,202 315,152 405,220" fill="#231754" opacity="0.7" />

  <!-- Calm Reflective Lake Illuminated by Violet Moonlight -->
  <rect x="4" y="218" width="460" height="75" fill="url(#lakeGrad)" opacity="0.85" />
  <!-- Shimmering Moonlight Water Ripples -->
  <g stroke="#e879f9" stroke-width="1.2" opacity="0.55" stroke-linecap="round">
    <line x1="165" y1="230" x2="235" y2="230" />
    <line x1="175" y1="238" x2="225" y2="238" stroke="#38bdf8" />
    <line x1="155" y1="246" x2="245" y2="246" />
    <line x1="180" y1="254" x2="220" y2="254" stroke="#c084fc" />
    <line x1="190" y1="262" x2="215" y2="262" />
  </g>

  <!-- Left Side: Glowing Cherry Blossom Tree Overhanging the Cliff -->
  <!-- Tree Trunk & Branches -->
  <path d="M 4,165 Q 38,140 56,105 Q 72,82 115,65" fill="none" stroke="#1e0b36" stroke-width="8" stroke-linecap="round" />
  <path d="M 42,125 Q 78,115 108,95" fill="none" stroke="#1e0b36" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 25,142 Q 55,145 82,132" fill="none" stroke="#1e0b36" stroke-width="3.5" stroke-linecap="round" />
  <!-- Glowing Pink & Violet Cherry Blossom Clusters -->
  <g filter="url(#glow)">
    <circle cx="35" cy="75" r="28" fill="#a855f7" opacity="0.65" />
    <circle cx="72" cy="62" r="32" fill="#ec4899" opacity="0.6" />
    <circle cx="112" cy="68" r="26" fill="#d946ef" opacity="0.65" />
    <circle cx="55" cy="95" r="25" fill="#c084fc" opacity="0.7" />
    <circle cx="95" cy="92" r="22" fill="#f472b6" opacity="0.65" />
    <circle cx="22" cy="105" r="22" fill="#9333ea" opacity="0.7" />
  </g>
  <!-- Individual Bright Blossom Petals & Floating Particles -->
  <g fill="#fbcfe8">
    <circle cx="42" cy="68" r="3" /><circle cx="65" cy="55" r="3.5" /><circle cx="88" cy="64" r="2.8" />
    <circle cx="115" cy="62" r="3" /><circle cx="54" cy="86" r="2.5" /><circle cx="78" cy="82" r="3.2" />
    <circle cx="102" cy="88" r="2.5" /><circle cx="30" cy="92" r="3" /><circle cx="132" cy="78" r="2.2" />
    <circle cx="148" cy="96" r="2" fill="#e879f9" /><circle cx="162" cy="112" r="1.8" fill="#38bdf8" />
  </g>

  <!-- Bottom-Left: Rocky Cliff & Female Developer Silhouette Working on Glowing Blue Laptop -->
  <!-- Rocky Cliff Ledge -->
  <polygon points="4,215 95,212 148,225 178,268 195,316 4,316" fill="#09071c" stroke="#3b0764" stroke-width="1.2" />
  <polygon points="12,215 92,213 138,224 115,245 35,240" fill="#18113c" opacity="0.8" />

  <!-- Soft Purple & Blue Glow Around the Developer's Laptop -->
  <circle cx="118" cy="190" r="28" fill="#38bdf8" opacity="0.38" filter="url(#glow)" />
  <circle cx="105" cy="192" r="38" fill="#a855f7" opacity="0.28" filter="url(#glow)" />

  <!-- Female Software Developer Silhouette Sitting on the Cliff -->
  <g transform="translate(62, 145)">
    <!-- Head & Hair Silhouette -->
    <circle cx="22" cy="14" r="9.5" fill="#0d0a24" stroke="#c084fc" stroke-width="0.8" />
    <!-- Flowing Long Hair -->
    <path d="M 14,12 Q 6,24 8,40 Q 14,38 18,26 Z" fill="#09071a" />
    <!-- Torso / Jacket with Purple Rim Light -->
    <path d="M 15,24 C 12,38 12,54 14,66 L 34,66 C 35,52 32,36 26,24 Z" fill="#141138" stroke="#a855f7" stroke-width="1" />
    <!-- Seated Legs Extending Forward on Cliff -->
    <path d="M 28,62 L 54,60 L 66,68 L 20,68 Z" fill="#0d0b26" stroke="#6366f1" stroke-width="0.8" />
    <!-- Arms Reaching to Laptop -->
    <path d="M 26,34 L 40,48 L 50,48" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" />
    <!-- Glowing Blue Laptop on Her Lap / Ledge -->
    <polygon points="48,48 64,48 72,32 56,32" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.2" filter="url(#glow)" />
    <line x1="42" y1="49" x2="60" y2="49" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Glowing Cursive Motto on the Cliff: "Dream • Code • Innovate" -->
  <text x="98" y="276" text-anchor="middle" fill="#e9d5ff" font-family="'Segoe Script', 'Brush Script MT', 'Georgia', cursive, italic" font-size="15.5" font-style="italic" font-weight="600" filter="url(#glow)">
    Dream • Code • Innovate
  </text>
  <path d="M 42 284 Q 98 278 154 284" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.85" />

  <!-- Right Side: Semi-Transparent Dark Glass-Style "Let's Connect" Card -->
  <rect x="235" y="54" width="735" height="145" rx="16" fill="url(#glassFill)" stroke="url(#neonBorder)" stroke-width="1.8" />

  <!-- Glowing Lightbulb Icon -->
  <circle cx="282" cy="126" r="24" fill="#16143d" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="282" cy="126" r="16" fill="#f59e0b" opacity="0.25" filter="url(#glow)" />
  <text x="282" y="134" text-anchor="middle" font-size="23" font-family="'Segoe UI Emoji', sans-serif">💡</text>

  <!-- Let's Connect Text -->
  <text x="320" y="106" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18.5" font-weight="700">
    Let's Connect
  </text>
  <text x="320" y="130" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">
    I'm always interested in collaborating on AI, Machine Learning,
  </text>
  <text x="320" y="150" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">
    Computer Vision and Software Engineering projects.
  </text>

  <!-- Divider 1 -->
  <line x1="635" y1="80" x2="635" y2="172" stroke="#312e81" stroke-width="1.5" />

  <!-- Quote -->
  <text x="735" y="120" text-anchor="middle" fill="#e879f9" font-family="'Segoe UI', sans-serif" font-size="14" font-style="italic" font-weight="600">
    "Turning ideas
  </text>
  <text x="735" y="142" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="14" font-style="italic" font-weight="600">
    into intelligent solutions."
  </text>

  <!-- Divider 2 -->
  <line x1="835" y1="80" x2="835" y2="172" stroke="#312e81" stroke-width="1.5" />

  <!-- Social Icons -->
  <g transform="translate(852, 108)">
    <circle cx="18" cy="18" r="16" fill="#0d1330" stroke="#a855f7" stroke-width="1.4" />
    <text x="18" y="23" text-anchor="middle" font-size="14">🐙</text>
    <circle cx="56" cy="18" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.4" />
    <text x="56" y="23" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800">in</text>
    <circle cx="94" cy="18" r="16" fill="#881337" stroke="#f472b6" stroke-width="1.4" />
    <text x="94" y="23" text-anchor="middle" font-size="13">✉️</text>
  </g>

  <!-- Thanks Message -->
  <text x="580" y="242" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">
    💜 Thanks for visiting my profile!
  </text>

  <!-- Elegant Flowing Neon-Purple & Electric-Blue Waves Across the Bottom Edge -->
  <path d="M 6 298 Q 220 252 490 288 T 994 268" fill="none" stroke="url(#wavePurple)" stroke-width="3.5" filter="url(#glow)" />
  <path d="M 6 308 Q 280 272 550 300 T 994 286" fill="none" stroke="url(#waveCyan)" stroke-width="2" />
  <path d="M 120 314 Q 420 285 710 308 T 994 298" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.6" />
</svg>
