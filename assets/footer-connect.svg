<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030816" />
      <stop offset="50%" stop-color="#071535" />
      <stop offset="100%" stop-color="#040b1f" />
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="996" height="116" rx="16" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="2" />

  <!-- Handshake Icon -->
  <circle cx="54" cy="60" r="24" fill="#0b1f47" stroke="#38bdf8" stroke-width="1.5" />
  <text x="54" y="68" text-anchor="middle" font-size="24" font-family="'Segoe UI Emoji', sans-serif">🤝</text>

  <!-- Left Text -->
  <text x="94" y="45" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">
    Let's Connect
  </text>
  <text x="94" y="69" fill="#bae6fd" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5">
    I'm always interested in collaborating on AI, Machine Learning, Computer Vision
  </text>
  <text x="94" y="89" fill="#bae6fd" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5">
    and Software Engineering projects.
  </text>

  <!-- Vertical Divider -->
  <line x1="590" y1="24" x2="590" y2="96" stroke="#1e3a8a" stroke-width="1.5" />

  <!-- Right Quote -->
  <text x="795" y="55" text-anchor="middle" fill="#60a5fa" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-style="italic" font-weight="600">
    "Turning ideas
  </text>
  <text x="795" y="79" text-anchor="middle" fill="#38bdf8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-style="italic" font-weight="600">
    into intelligent solutions."
  </text>
</svg>
