<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 185" width="100%" height="185">
  <defs>
    <!-- Cosmic Deep Blue & Violet Card Background -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081a" />
      <stop offset="50%" stop-color="#0a0f2c" />
      <stop offset="100%" stop-color="#110c32" />
    </linearGradient>
    <!-- Neon Purple & Electric Blue Border -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85" />
    </linearGradient>
    <!-- Flowing Neon Bottom Waves -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Let's Connect Card -->
  <rect x="2" y="2" width="996" height="106" rx="16" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="2" />

  <!-- Glowing Lightbulb Icon (Left) -->
  <circle cx="52" cy="55" r="24" fill="#13183d" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="52" cy="55" r="16" fill="#f59e0b" opacity="0.2" filter="url(#glow)" />
  <text x="52" y="63" text-anchor="middle" font-size="24" font-family="'Segoe UI Emoji', sans-serif">💡</text>

  <!-- Left Text -->
  <text x="90" y="42" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="17.5" font-weight="700">
    Let's Connect
  </text>
  <text x="90" y="64" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="13">
    I'm always interested in collaborating on AI, Machine Learning,
  </text>
  <text x="90" y="83" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="13">
    Computer Vision and Software Engineering projects.
  </text>

  <!-- Vertical Divider 1 -->
  <line x1="525" y1="22" x2="525" y2="88" stroke="#1e293b" stroke-width="1.5" />

  <!-- Center Quote -->
  <text x="675" y="50" text-anchor="middle" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="14.5" font-style="italic" font-weight="600">
    "Turning ideas
  </text>
  <text x="675" y="72" text-anchor="middle" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="14.5" font-style="italic" font-weight="600">
    into intelligent solutions."
  </text>

  <!-- Vertical Divider 2 -->
  <line x1="820" y1="22" x2="820" y2="88" stroke="#1e293b" stroke-width="1.5" />

  <!-- Right Social Circle Icons (GitHub, LinkedIn, Email) -->
  <g transform="translate(845, 35)">
    <!-- GitHub Circle -->
    <circle cx="20" cy="20" r="19" fill="#0d1330" stroke="#6366f1" stroke-width="1.5" />
    <text x="20" y="26" text-anchor="middle" font-size="17">🐙</text>
    <!-- LinkedIn Circle -->
    <circle cx="68" cy="20" r="19" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <text x="68" y="26" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="800">in</text>
    <!-- Email Circle -->
    <circle cx="116" cy="20" r="19" fill="#7c2d12" stroke="#f43f5e" stroke-width="1.5" />
    <text x="116" y="26" text-anchor="middle" font-size="16">✉️</text>
  </g>

  <!-- Bottom Thanks Text & Flowing Neon Purple/Blue Waves -->
  <text x="500" y="142" text-anchor="middle" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="14.5" font-weight="700">
    💜 Thanks for visiting my profile!
  </text>

  <!-- Neon Waves -->
  <path d="M 10 172 Q 240 135 500 165 T 990 150" fill="none" stroke="url(#wave1)" stroke-width="3" filter="url(#glow)" />
  <path d="M 40 180 Q 310 155 560 175 T 980 165" fill="none" stroke="url(#wave2)" stroke-width="1.8" />
</svg>
