  <text x="20" y="166" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12.5">AI-powered virtual saree draping &amp;</text>
  <text x="20" y="184" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12.5">multi-garment diffusion try-on studio</text>

  <!-- Divider -->
