<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 285" width="100%" height="285">
  <defs>
    <!-- Deep Sapphire & Midnight Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030816" />
      <stop offset="45%" stop-color="#071330" />
      <stop offset="100%" stop-color="#040b1e" />
    </linearGradient>
    <!-- Electric Blue to Cyan Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <!-- Glowing Electric Blue Border -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>
    <!-- Laptop Screen Dark Blue Gradient -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f295c" />
      <stop offset="100%" stop-color="#051026" />
    </linearGradient>
    <!-- Pill Box Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081738" />
      <stop offset="100%" stop-color="#0c214e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Blue Card -->
  <rect x="2" y="2" width="996" height="281" rx="18" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="2.2" />

  <!-- Subtle Cyber Blue Grid Lines -->
  <g stroke="#1e3a8a" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="70" x2="1000" y2="70" />
    <line x1="0" y1="140" x2="1000" y2="140" />
    <line x1="0" y1="210" x2="1000" y2="210" />
    <line x1="250" y1="0" x2="250" y2="285" />
    <line x1="500" y1="0" x2="500" y2="285" />
    <line x1="750" y1="0" x2="750" y2="285" />
  </g>

  <!-- Glowing Blue Star Particles -->
  <circle cx="85" cy="38" r="1.8" fill="#38bdf8" opacity="0.7" />
  <circle cx="460" cy="32" r="2.2" fill="#60a5fa" opacity="0.6" />
  <circle cx="640" cy="65" r="1.6" fill="#06b6d4" opacity="0.8" />
  <circle cx="930" cy="42" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="570" cy="235" r="1.8" fill="#3b82f6" opacity="0.5" />
  <circle cx="710" cy="250" r="2.2" fill="#06b6d4" opacity="0.6" />

  <!-- Ambient Sapphire & Cyan Orbs -->
  <circle cx="815" cy="140" r="115" fill="#1d4ed8" opacity="0.22" filter="url(#glow)" />
  <circle cx="755" cy="160" r="85" fill="#0284c7" opacity="0.20" filter="url(#glow)" />

  <!-- Left Content: Greeting & Headline -->
  <text x="48" y="68" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">
    Hi, I'm 👋
  </text>

  <text x="48" y="115" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="41" font-weight="800">
    <tspan fill="#ffffff">Vaisnavi </tspan>
    <tspan fill="url(#nameGrad)">Rajaratnam</tspan>
  </text>

  <!-- Terminal Pill Box -->
  <rect x="48" y="138" width="545" height="42" rx="9" fill="url(#pillBg)" stroke="#2563eb" stroke-width="1.6" />
  <text x="66" y="164" fill="#e2e8f0" font-family="'Consolas', 'Courier New', monospace" font-size="15.5" font-weight="600">
    <tspan fill="#38bdf8">&gt; </tspan>Software Engineer | AI &amp; Computer Vision Enthusiast <tspan fill="#06b6d4">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="48" y="214" fill="#bae6fd" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-style="italic">
    Building Intelligent Software &amp; AI-Powered Solutions ✨
  </text>

  <!-- Location & Education Subtitle -->
  <text x="48" y="248" fill="#93c5fd" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500">
    🎓 BSc (Hons) Software Engineering – University of Bedfordshire (2:1)   •   📍 Jaffna, Sri Lanka
  </text>

  <!-- Right Content: Cyberpunk Glowing Sapphire Laptop Illustration -->
  <g transform="translate(690, 52)">
    <!-- Laptop Screen Frame -->
    <polygon points="45,15 215,5 200,130 30,140" fill="url(#screenGlow)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Inner Screen Bezel -->
    <polygon points="52,22 207,13 194,123 38,132" fill="#03091c" stroke="#1d4ed8" stroke-width="1.2" />
    <!-- Code Symbol </> on Screen -->
    <text x="122" y="84" text-anchor="middle" fill="#38bdf8" font-family="'Consolas', 'Courier New', monospace" font-size="38" font-weight="700" filter="url(#glow)">
      &lt;/&gt;
    </text>
    <!-- Laptop Base / Keyboard Deck -->
    <polygon points="30,140 200,130 245,162 0,174" fill="#0b1d42" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round" />
    <!-- Keyboard Grid Highlight -->
    <polygon points="35,146 192,137 215,153 18,163" fill="#1e3a8a" opacity="0.75" />
    <!-- Trackpad -->
    <polygon points="102,158 140,156 146,164 96,166" fill="#040d21" stroke="#38bdf8" stroke-width="0.9" />
    <!-- Bottom Neon Glow Line -->
    <line x1="-10" y1="180" x2="255" y2="167" stroke="url(#neonBorder)" stroke-width="3.5" opacity="0.95" filter="url(#glow)" />
  </g>
</svg>
