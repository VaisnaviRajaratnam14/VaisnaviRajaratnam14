<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090716" />
      <stop offset="50%" stop-color="#0f0b29" />
      <stop offset="100%" stop-color="#080b1a" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="996" height="276" rx="18" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Subtle Grid / Star Particles -->
  <circle cx="80" cy="40" r="1.5" fill="#a855f7" opacity="0.6" />
  <circle cx="480" cy="35" r="2" fill="#38bdf8" opacity="0.5" />
  <circle cx="650" cy="70" r="1.5" fill="#c084fc" opacity="0.7" />
  <circle cx="920" cy="45" r="2" fill="#06b6d4" opacity="0.6" />
  <circle cx="580" cy="230" r="1.5" fill="#a855f7" opacity="0.4" />
  <circle cx="720" cy="245" r="2" fill="#3b82f6" opacity="0.5" />

  <!-- Ambient Neon Orbs -->
  <circle cx="820" cy="140" r="110" fill="#6d28d9" opacity="0.18" filter="url(#glow)" />
  <circle cx="760" cy="160" r="80" fill="#2563eb" opacity="0.15" filter="url(#glow)" />

  <!-- Left Content: Greeting & Headline -->
  <text x="48" y="68" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700">
    Hi, I'm 👋
  </text>

  <text x="48" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800">
    <tspan fill="#ffffff">Vaisnavi </tspan>
    <tspan fill="url(#nameGrad)">Rajaratnam</tspan>
  </text>

  <!-- Terminal Pill Box -->
  <rect x="48" y="136" width="535" height="40" rx="8" fill="#110e26" stroke="#4c1d95" stroke-width="1.5" />
  <text x="64" y="161" fill="#e2e8f0" font-family="'Consolas', 'Courier New', monospace" font-size="15.5" font-weight="600">
    <tspan fill="#a855f7">&gt; </tspan>Software Engineer | AI &amp; Computer Vision Enthusiast <tspan fill="#38bdf8">_</tspan>
  </text>

  <!-- Tagline -->
  <text x="48" y="212" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-style="italic">
    Building Intelligent Software &amp; AI-Powered Solutions ✨
  </text>

  <!-- Location & Education Subtitle -->
  <text x="48" y="246" fill="#94a3b8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5">
    🎓 BSc (Hons) Software Engineering – University of Bedfordshire (2:1)   •   📍 Jaffna, Sri Lanka
  </text>

  <!-- Right Content: Cyberpunk Glowing Laptop Illustration -->
  <g transform="translate(690, 52)">
    <!-- Laptop Screen Frame -->
    <polygon points="45,15 215,5 200,130 30,140" fill="url(#screenGlow)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Inner Screen Bezel -->
    <polygon points="52,22 207,13 194,123 38,132" fill="#07091e" stroke="#7c3aed" stroke-width="1" />
    <!-- Code Symbol </> on Screen -->
    <text x="122" y="84" text-anchor="middle" fill="#60a5fa" font-family="'Consolas', 'Courier New', monospace" font-size="36" font-weight="700" filter="url(#glow)">
      &lt;/&gt;
    </text>
    <!-- Laptop Base / Keyboard Deck -->
    <polygon points="30,140 200,130 245,162 0,174" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" stroke-linejoin="round" />
    <!-- Keyboard Grid Highlight -->
    <polygon points="35,146 192,137 215,153 18,163" fill="#312e81" opacity="0.7" />
    <!-- Trackpad -->
    <polygon points="102,158 140,156 146,164 96,166" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <!-- Bottom Neon Glow Line -->
    <line x1="-10" y1="180" x2="255" y2="167" stroke="url(#neonBorder)" stroke-width="3" opacity="0.85" filter="url(#glow)" />
  </g>
</svg>
